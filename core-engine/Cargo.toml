[package]
name = "athar-core"
version = "1.0.0"
edition = "2021"
authors = ["XRTM8 <athar@xrtm8.app>"]
description = "Core high-performance Arabic typography and vector engine for Athar App (أثر)"

[lib]
name = "athar_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# JNI for Android bindings
jni = { version = "0.21", default-features = false }

# Arabic text shaping & OpenType layout
rustybuzz = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging for Android Logcat
log = "0.4"
