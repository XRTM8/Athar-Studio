name: Build & Release Athar APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Signing Keystore
        env:
          ATHAR_KEYSTORE_BASE64: ${{ secrets.ATHAR_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "${ATHAR_KEYSTORE_BASE64:?Missing signing secret}" | base64 --decode > keystore/athar-release.jks

      - name: Run Unit Tests
        run: |
          cd android-app
          chmod +x gradlew || true
          ./gradlew testReleaseUnitTest lintRelease

      - name: Build Signed Release APK
        env:
          ATHAR_KEYSTORE_PASSWORD: ${{ secrets.ATHAR_KEYSTORE_PASSWORD }}
          ATHAR_KEY_PASSWORD: ${{ secrets.ATHAR_KEY_PASSWORD }}
          ATHAR_KEY_ALIAS: ${{ secrets.ATHAR_KEY_ALIAS || 'athar_release' }}
          ATHAR_KEYSTORE_PATH: ${{ github.workspace }}/keystore/athar-release.jks
        run: |
          cd android-app
          ./gradlew assembleRelease

      - name: Prepare Single Release APK
        run: |
          mkdir -p release
          cp android-app/app/build/outputs/apk/release/app-release.apk release/athar-${{ github.ref_name }}-universal.apk

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Athar Studio ${{ github.ref_name }}"
          files: |
            release/athar-${{ github.ref_name }}-universal.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
